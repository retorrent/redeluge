#
# A local lab for archive targets: silo (MinIO) as the S3, two rclone mounts, and
# redeluge on top. See README.md. Test credentials only; nothing here is
# reachable from outside this machine.
services:
  minio:
    # pgsty/silo, a maintained MinIO build: Docker Hub no longer carries
    # minio/minio. The console is on 19001 to see what lands in the buckets.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lab
      MINIO_ROOT_PASSWORD: labpassword
    ports:
      - "127.0.0.1:19001:9001"

  lab:
    build: .
    depends_on: [minio]
    devices: [/dev/fuse]
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    environment:
      # Remotes behind the two targets. Point B at your own S3 by giving a
      # rclone.conf next to this file and REMOTE_B=<remote>:<bucket>.
      REMOTE_A: ${REMOTE_A:-minio:archive-a}
      REMOTE_B: ${REMOTE_B:-minio:archive-b}
      # The lab's Web UI password; lab.py logs in with it.
      DELUGE_WEB_PASSWORD: deluge
      DELUGE_WEB_CONNECTION_MANAGER: ${DELUGE_WEB_CONNECTION_MANAGER:-0}
      # Targets to leave unmounted at start, e.g. LAB_DOWN=a: a restart
      # during an outage.
      LAB_DOWN: ${LAB_DOWN:-}
      # How long rclone waits before uploading a closed file. Longer makes
      # the upload window easy to watch, and to hit with a peer.
      LAB_WRITE_BACK: ${LAB_WRITE_BACK:-5s}
    volumes:
      - ../..:/src:ro
      - config:/config
      - downloads:/downloads
      - cache:/cache
    ports:
      - "127.0.0.1:18112:8112"
    command: ["bash", "/src/docker/archive-lab/start.sh"]

  peer:
    # A second redeluge with no archive, to download from the first one:
    # the demand that has to stop an archive upload.
    build: .
    environment:
      DELUGE_WEB_PASSWORD: deluge
    volumes:
      - ../..:/src:ro
    command:
      - bash
      - -c
      - |
        export PATH=/src/target-docker/debug:$$PATH DELUGE_CONFIG_DIR=/config DELUGE_DOWNLOAD_DIR=/downloads
        export DELUGE_WEB_INTERFACE=0.0.0.0 DELUGE_WEB_PORT=8112 DELUGE_WEB_BASE=/
        mkdir -p /config /downloads
        exec bash /src/docker/run.sh

volumes:
  config:
  downloads:
  cache:
